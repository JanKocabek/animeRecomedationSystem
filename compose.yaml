services:
  anime-recommend-app-db:
    image: "mysql:lts"
    container_name: anime_db
    environment:
      - MYSQL_DATABASE:{DB_NAME}
      - MYSQL_USER:${DB_USERNAME}
      - MYSQL_PASSWORD_FILE:/run/secrets/db_password
    secrets:
      - db_password
    ports:
      - "3307:3306"
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10
      interval: 10s
      start_period: 30s
    networks:
      - anime-network
    restart: unless-stopped
  anime-recommend-app:
    profiles: ["container"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_PROFILE: ${BUILD_PROFILE:-local} # Default to local profile
    container_name: anime_Recommendation_App
    depends_on:
      anime-recommend-app-db:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-local}
      - DB_URL=${DB_URL}
      - DB_NAME=${DB_NAME}
      - DB_USERNAME=${DB_USERNAME}
      - "JAVA_OPTS=-Xms512m -Xmx1024m"
    secrets:
      - db_password

    ports:
      - "8080:8080"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8080/actuator/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - anime-network
    restart: unless-stopped

volumes:
  database:
    driver: local

networks:
  anime-network:
    driver: bridge

secrets:
  db_password:
    file: ./secrets/db_pass.txt
